<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<title>NoodleFlow · Operator Intelligence</title>
<meta name="viewport" content="width=1440"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('nf-theme');document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'light');})();</script>
<link rel="stylesheet" href="tokens.css?v=20260724f">
<link rel="stylesheet" href="shell.css?v=20260609">
<link rel="stylesheet" href="screens.css?v=20260619">
<link rel="stylesheet" href="theme-overrides.css?v=20260724f">
<link rel="stylesheet" href="client-modules.css?v=20260717t">
<link rel="stylesheet" href="feedback.css?v=20260727j">
</head>
<body>
<div id="root"></div>

<script>
(function(){
  var LIBS = [
    'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
    'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
    'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js'
  ];
  var FILES = [
    'data.jsx','store.jsx','common.jsx','nf-shared.jsx',
    'shell.jsx','command-center.jsx','operator.jsx',
    'banking.jsx','reconcile.jsx','extras.jsx','nf-features.jsx','app.jsx'
  ];
  var ASSET_V = '20260727j';
  function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){rej(new Error('Failed to load '+src));}; document.head.appendChild(s); }); }
  LIBS.reduce(function(p,u){return p.then(function(){return loadScript(u);});}, Promise.resolve())
    .then(function(){
      return FILES.reduce(function(p,f){
        return p.then(function(acc){
          return fetch(f + '?v=' + ASSET_V, { cache: 'no-store' }).then(function(r){return r.text();}).then(function(code){ return acc+'\n;\n'+code; });
        });
      }, Promise.resolve(''));
    })
    .then(function(allCode){ (0,eval)(Babel.transform(allCode,{presets:['react']}).code); })
    .catch(function(e){ document.getElementById('root').textContent='Load error: '+e.message; });
})();
</script>
</body>
</html>
