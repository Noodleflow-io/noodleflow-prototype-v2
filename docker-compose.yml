name: noodleflow-prototype

services:
  prototype:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: noodleflow-prototype
    ports:
      - '8081:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 10
